<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <defs>
    <linearGradient id="expBg" x1="20" y1="20" x2="220" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="expPrimary" x1="40" y1="30" x2="160" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="expAccent" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="100" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="120" cy="90" r="75" fill="url(#expBg)" opacity="0.7"/>
  <circle cx="170" cy="55" r="28" fill="#F3E8FF" opacity="0.6"/>
  <circle cx="70" cy="125" r="32" fill="#E0F2FE" opacity="0.6"/>

  <!-- Back Document (tilted) -->
  <g transform="rotate(-8 105 85)">
    <rect x="70" y="35" width="70" height="95" rx="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="80" y="48" width="36" height="6" rx="3" fill="#94A3B8"/>
    <rect x="80" y="60" width="50" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="80" y="70" width="44" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="80" y="80" width="48" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Main Front Paper Card -->
  <g>
    <rect x="85" y="40" width="80" height="105" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Paper Header Banner -->
    <rect x="97" y="52" width="34" height="7" rx="3.5" fill="url(#expPrimary)"/>
    <rect x="135" y="52" width="18" height="7" rx="3.5" fill="#E0E7FF"/>
    
    <!-- Text Lines -->
    <rect x="97" y="68" width="56" height="4" rx="2" fill="#64748B"/>
    <rect x="97" y="78" width="48" height="4" rx="2" fill="#94A3B8"/>
    <rect x="97" y="88" width="52" height="4" rx="2" fill="#CBD5E1"/>
    <rect x="97" y="98" width="40" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="97" y="108" width="46" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="97" y="118" width="32" height="4" rx="2" fill="#E2E8F0"/>
  </g>

  <!-- Floating Magnifying Glass with AI Stars -->
  <g transform="translate(130, 80)">
    <circle cx="28" cy="28" r="22" fill="#FFFFFF" stroke="url(#expPrimary)" stroke-width="3.5"/>
    <circle cx="28" cy="28" r="16" fill="#F5F3FF" opacity="0.6"/>
    <!-- Handle -->
    <path d="M44 44L60 60" stroke="url(#expPrimary)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- AI Sparkle in glass -->
    <path d="M28 19L29.5 24.5L35 26L29.5 27.5L28 33L26.5 27.5L21 26L26.5 24.5Z" fill="url(#expPrimary)"/>
  </g>

  <!-- Decorative Sparkles -->
  <path d="M65 42L66.5 46.5L71 48L66.5 49.5L65 54L63.5 49.5L59 48L63.5 46.5Z" fill="#38BDF8"/>
  <circle cx="190" cy="115" r="3.5" fill="#A855F7"/>
  <circle cx="55" cy="100" r="2.5" fill="#818CF8"/>
  <circle cx="178" cy="38" r="3" fill="#38BDF8"/>
</svg>
