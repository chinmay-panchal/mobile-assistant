<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="bgGrad3" x1="30" y1="30" x2="280" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="120" y1="40" x2="200" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background pastel blob -->
  <path d="M70 60C45 100 80 160 140 180C200 200 260 160 270 110C280 60 230 25 170 30C110 35 95 20 70 60Z" fill="url(#bgGrad3)"/>

  <!-- Decorative Orbit ring -->
  <circle cx="160" cy="100" r="75" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>

  <!-- Sparkles -->
  <path d="M60 90L62 94L66 96L62 98L60 102L58 98L54 96L58 94Z" fill="#F472B6"/>
  <path d="M260 65L262 70L267 72L262 74L260 79L258 74L253 72L258 70Z" fill="#FBBF24"/>
  <circle cx="245" cy="140" r="4.5" fill="#38BDF8"/>
  <circle cx="85" cy="45" r="3.5" fill="#818CF8"/>

  <!-- Security Shield & Lock Base -->
  <g>
    <!-- Soft shadow -->
    <path d="M162 46L207 64V109C207 139 184 162 162 172C140 162 117 139 117 109V64L162 46Z" fill="#4F46E5" fill-opacity="0.08"/>
    <!-- Big Rounded Shield -->
    <path d="M160 42L205 60V105C205 135 182 158 160 168C138 158 115 135 115 105V60L160 42Z" fill="url(#shieldGrad)" stroke="#EEF2FF" stroke-width="2"/>
    
    <!-- Lock Shackle -->
    <path d="M148 95V82C148 75.3726 153.373 70 160 70C166.627 70 172 75.3726 172 82V95" stroke="#4338CA" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Lock Body -->
    <rect x="140" y="93" width="40" height="32" rx="10" fill="url(#lockGrad)"/>
    <circle cx="160" cy="106" r="3.5" fill="#FFFFFF"/>
    <path d="M160 109V116" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Left Floating Badge: Email Envelope -->
  <g>
    <rect x="72" y="98" width="44" height="36" rx="12" fill="#000000" fill-opacity="0.04"/>
    <rect x="70" y="95" width="44" height="36" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <path d="M78 104L92 114L106 104" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="78" y="103" width="28" height="20" rx="3" stroke="#C7D2FE" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Right Floating Badge: Golden Key -->
  <g>
    <circle cx="232" cy="118" r="22" fill="#000000" fill-opacity="0.04"/>
    <circle cx="230" cy="115" r="22" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="225" cy="111" r="5" stroke="url(#keyGrad)" stroke-width="2.5" fill="none"/>
    <path d="M228 114L238 123M235 120L237 122M233 118L235 120" stroke="url(#keyGrad)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
