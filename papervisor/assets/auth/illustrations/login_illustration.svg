<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="bgGrad1" x1="40" y1="20" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="140" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="primGrad" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0" y1="0" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background decorative pastel blob -->
  <path d="M70 50C100 15 220 20 260 60C300 100 270 170 210 185C150 200 60 175 45 130C30 85 40 85 70 50Z" fill="url(#bgGrad1)"/>
  
  <!-- Subtle decorative rings -->
  <circle cx="270" cy="45" r="16" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="3 3" fill="none"/>
  <circle cx="48" cy="140" r="12" stroke="#BAE6FD" stroke-width="2" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Sparkles -->
  <path d="M260 120L263 128L271 131L263 134L260 142L257 134L249 131L257 128Z" fill="#38BDF8"/>
  <path d="M62 48L64 53L69 55L64 57L62 62L60 57L55 55L60 53Z" fill="#0284C7"/>
  <circle cx="95" cy="28" r="3.5" fill="#38BDF8"/>
  <circle cx="230" cy="175" r="4.5" fill="#0284C7"/>

  <!-- Main Floating App Card -->
  <g>
    <!-- Soft shadow shape -->
    <rect x="94" y="48" width="140" height="116" rx="20" fill="#0F172A" fill-opacity="0.06"/>
    <rect x="90" y="42" width="140" height="116" rx="20" fill="url(#cardGrad)" stroke="#BAE6FD" stroke-width="1.5"/>
    
    <!-- Card header lines / pill -->
    <rect x="110" y="58" width="52" height="8" rx="4" fill="#BAE6FD"/>
    <rect x="110" y="72" width="100" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="110" y="82" width="80" height="4" rx="2" fill="#F1F5F9"/>

    <!-- Test/Exam Paper checklist preview inside card -->
    <rect x="110" y="98" width="12" height="12" rx="4" fill="#EFF6FF"/>
    <path d="M113 104L116 107L120 101" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="102" width="60" height="4" rx="2" fill="#CBD5E1"/>

    <rect x="110" y="118" width="12" height="12" rx="4" fill="#EFF6FF"/>
    <path d="M113 124L116 127L120 121" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="122" width="45" height="4" rx="2" fill="#CBD5E1"/>
  </g>

  <!-- Left Accent Badge: AI Brain / Document Icon -->
  <g>
    <circle cx="82" cy="118" r="24" fill="#0284C7" fill-opacity="0.15"/>
    <circle cx="82" cy="115" r="24" fill="url(#primGrad)"/>
    <path d="M74 115C74 110.582 77.5817 107 82 107C86.4183 107 90 110.582 90 115C90 119.418 86.4183 123 82 123" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M82 107V123" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="82" cy="115" r="2" fill="#FFFFFF"/>
    <circle cx="76" cy="111" r="1.5" fill="#FFFFFF"/>
    <circle cx="88" cy="119" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- Right Floating Badge: Teacher Pencil & Star -->
  <g>
    <rect x="210" y="96" width="44" height="44" rx="14" fill="#000000" fill-opacity="0.04"/>
    <rect x="208" y="92" width="44" height="44" rx="14" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="230" cy="114" r="15" fill="#EFF6FF"/>
    <!-- Pencil -->
    <path d="M225 120L222 122L224 119L233 110C233.5 109.5 234.5 109.5 235 110L236 111C236.5 111.5 236.5 112.5 236 113L225 120Z" fill="url(#accentGrad)"/>
  </g>
  
  <!-- Tiny Floating Notification Pill -->
  <g>
    <rect x="135" y="24" width="70" height="24" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1"/>
    <circle cx="147" cy="36" r="4" fill="#10B981"/>
    <rect x="156" y="33" width="38" height="6" rx="3" fill="#94A3B8"/>
  </g>
</svg>
