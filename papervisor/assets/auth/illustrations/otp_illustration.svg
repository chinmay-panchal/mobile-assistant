<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="bgGrad4" x1="40" y1="20" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F0FDF4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FAF5FF" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0" y1="0" x2="160" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="codeBoxGrad" x1="0" y1="0" x2="20" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
  </defs>

  <!-- Ambient pastel blob -->
  <path d="M75 55C50 95 85 160 145 180C205 200 265 155 270 105C275 55 220 25 160 30C100 35 100 15 75 55Z" fill="url(#bgGrad4)"/>

  <!-- Sparkles -->
  <circle cx="255" cy="50" r="4" fill="#38BDF8"/>
  <circle cx="65" cy="145" r="5" fill="#34D399"/>
  <path d="M265 130L267 134L271 136L267 138L265 142L263 138L259 136L263 134Z" fill="#FBBF24"/>

  <!-- Main Floating Card: Mail with 6-digit OTP boxes -->
  <g>
    <rect x="84" y="50" width="160" height="112" rx="20" fill="#0284C7" fill-opacity="0.08"/>
    <rect x="80" y="44" width="160" height="112" rx="20" fill="url(#cardGrad4)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Top envelope flap decoration -->
    <path d="M82 46L160 98L238 46" stroke="#C7D2FE" stroke-width="2" stroke-linecap="round"/>

    <!-- 6 little code boxes preview -->
    <g transform="translate(94, 98)">
      <rect x="0" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="9" cy="12" r="3" fill="#4338CA"/>

      <rect x="22" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="31" cy="12" r="3" fill="#4338CA"/>

      <rect x="44" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="53" cy="12" r="3" fill="#4338CA"/>

      <rect x="68" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="77" cy="12" r="3" fill="#4338CA"/>

      <rect x="90" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="99" cy="12" r="3" fill="#4338CA"/>

      <rect x="112" y="0" width="18" height="24" rx="6" fill="url(#codeBoxGrad)" stroke="#818CF8" stroke-width="1"/>
      <circle cx="121" cy="12" r="3" fill="#4338CA"/>
    </g>
  </g>

  <!-- Left Floating Badge: Sent Paper Airplane -->
  <g>
    <circle cx="70" cy="83" r="22" fill="#000000" fill-opacity="0.04"/>
    <circle cx="68" cy="80" r="22" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <path d="M60 84L76 72L70 88L65 83L60 84Z" fill="url(#cyanGrad)"/>
  </g>

  <!-- Right Floating Badge: Security Check -->
  <g>
    <circle cx="250" cy="88" r="22" fill="#000000" fill-opacity="0.04"/>
    <circle cx="248" cy="85" r="22" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="248" cy="85" r="14" fill="#10B981"/>
    <path d="M243 85L247 89L254 81" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
