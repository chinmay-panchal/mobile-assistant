<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none">
  <defs>
    <linearGradient id="chapBgGrad" x1="40" y1="20" x2="280" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EEF2FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F5F3FF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="bookCoverGrad" x1="80" y1="50" x2="240" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="badgeAccentGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <!-- Ambient Blob -->
  <path d="M65 45C35 90 70 160 140 180C210 200 270 155 275 95C280 40 215 15 150 20C90 25 90 5 65 45Z" fill="url(#chapBgGrad)"/>

  <!-- Orbits & Stars -->
  <circle cx="260" cy="50" r="10" stroke="#C7D2FE" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <circle cx="60" cy="130" r="8" stroke="#BAE6FD" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <circle cx="70" cy="60" r="4" fill="#6366F1"/>
  <circle cx="255" cy="140" r="4" fill="#38BDF8"/>
  <path d="M260 100L262 104L266 106L262 108L260 112L258 108L254 106L258 104Z" fill="#FBBF24"/>
  <path d="M58 85L60 89L64 91L60 93L58 97L56 93L52 91L56 89Z" fill="#818CF8"/>

  <!-- Ground Drop Shadow -->
  <ellipse cx="160" cy="165" rx="75" ry="10" fill="#4F46E5" fill-opacity="0.07"/>

  <!-- Open Book Base -->
  <rect x="85" y="65" width="150" height="90" rx="8" fill="url(#bookCoverGrad)"/>

  <!-- White Book Pages -->
  <!-- Left Page -->
  <rect x="92" y="70" width="64" height="80" rx="4" fill="#FFFFFF"/>
  <!-- Right Page -->
  <rect x="164" y="70" width="64" height="80" rx="4" fill="#F8FAFC"/>

  <!-- Spine Center Divider -->
  <line x1="160" y1="68" x2="160" y2="152" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Left Page Chapter Lines (Chapter 01) -->
  <rect x="100" y="80" width="20" height="6" rx="3" fill="#EEF2FF"/>
  <rect x="100" y="92" width="48" height="3" rx="1.5" fill="#C7D2FE"/>
  <rect x="100" y="99" width="42" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="100" y="106" width="46" height="3" rx="1.5" fill="#E2E8F0"/>

  <!-- Chapter 02 snippet -->
  <rect x="100" y="118" width="20" height="6" rx="3" fill="#EEF2FF"/>
  <rect x="100" y="130" width="48" height="3" rx="1.5" fill="#C7D2FE"/>
  <rect x="100" y="137" width="36" height="3" rx="1.5" fill="#E2E8F0"/>

  <!-- Right Page Lines -->
  <rect x="172" y="82" width="48" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="89" width="44" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="96" width="48" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="103" width="38" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="115" width="48" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="122" width="42" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="172" y="129" width="46" height="3" rx="1.5" fill="#E2E8F0"/>

  <!-- Colorful Chapter Index Tabs on Edge -->
  <rect x="228" y="78" width="10" height="14" rx="2" fill="#0284C7"/>
  <rect x="228" y="96" width="10" height="14" rx="2" fill="#10B981"/>
  <rect x="228" y="114" width="10" height="14" rx="2" fill="#F59E0B"/>
  <rect x="228" y="132" width="10" height="14" rx="2" fill="#EC4899"/>

  <!-- Top Bookmark Ribbon -->
  <path d="M155 64V82L160 78L165 82V64H155Z" fill="#F43F5E"/>

  <!-- Floating Plus / Add Chapter Badge -->
  <g transform="translate(210, 46)">
    <rect width="36" height="36" rx="12" fill="url(#badgeAccentGrad)"/>
    <line x1="18" y1="11" x2="18" y2="25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="11" y1="18" x2="25" y2="18" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
