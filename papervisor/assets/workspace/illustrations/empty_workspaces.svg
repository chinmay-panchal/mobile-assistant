    <rect x="220" y="96" width="38" height="38" rx="12" fill="#000000" fill-opacity="0.04"/>
    <rect x="218" y="92" width="38" height="38" rx="12" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="1.5"/>
    <circle cx="237" cy="111" r="11" fill="#FEF3C7"/>
    <path d="M237 104L239 108L243 109L240 112L241 116L237 114L233 116L234 112L231 109L235 108Z" fill="url(#orangeAccent)"/>
